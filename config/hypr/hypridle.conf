# ───────────────────────────── IDLE (hypridle) ──────────────────────────────
# You had no hypridle config at all, so the screen never locked or blanked.
# Window rules with idle_inhibit (games, video, PiP) keep this from firing
# while you play or watch something, and so do dbus inhibitors.
#
# Your monitors have no software brightness control (no /sys/class/backlight),
# so there is no brightness listener here — it wouldn't do anything.

general {
    lock_cmd = pidof hyprlock || hyprlock                     # manual lock only (keybind / wlogout)
    after_sleep_cmd = ~/.config/hypr/scripts/dpms.sh on        # wake the screens
    ignore_dbus_inhibit = false                                # respect mpv, browsers…
    ignore_systemd_inhibit = false
}

# No automatic lock on purpose: this is a personal desktop and the idle lock was
# firing far too early. lock_cmd above still answers `loginctl lock-session`, so
# locking by hand keeps working — it just never happens on its own, not even
# before suspend.

# 12 min: turn the screens off
listener {
    timeout = 720
    on-timeout = ~/.config/hypr/scripts/dpms.sh off
    on-resume  = ~/.config/hypr/scripts/dpms.sh on
}

# 1 h: suspend the machine.
# Careful: this counts input idleness, not CPU load. A long unattended job will
# NOT hold it off by itself — wrap those in `systemd-inhibit --what=idle:sleep`
# (ignore_systemd_inhibit above is false, so hypridle honours it).
# Same story for Sunshine: if a stream is idle at the keyboard, this cuts it.
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
