$colors = ~/.config/hypr/colors.conf
source = $colors

# ──────────────────────────────── behaviour ─────────────────────────────────
general {
    hide_cursor = true
    ignore_empty_input = true          # empty Enter is not a failed attempt
    text_trim = true
    fail_timeout = 2000
    immediate_render = true
    fractional_scaling = 2
    screencopy_mode = 0
}

auth {
    fingerprint {
        enabled = false                # set to true if you add a fingerprint reader
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 1.6, smooth
}

# ─────────────────────────────── background ─────────────────────────────────
background {
    monitor =
    path = $image
    blur_passes = 3
    blur_size = 6
    noise = 0.0125
    contrast = 1.05
    brightness = 0.72
    vibrancy = 0.18
    vibrancy_darkness = 0.05
}

# ────────────────────────────────── clock ───────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    font_family = JetBrainsMono Nerd Font ExtraBold
    font_size = 105
    # Back on $primary: $inverse_primary was tried and dropped — on the lighter
    # wallpapers it disappeared into the background.
    color = $primary
    # 90, not 74: at 105px the digits sat almost on top of the date line.
    position = 0, 90
    halign = center
    valign = center
    # No shadow_passes here on purpose: the drop shadow muddied the digits
    # against the blurred wallpaper. The background is already dimmed to 0.72
    # brightness, so the clock reads fine flat.
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %-d"
    font_family = JetBrainsMono Nerd Font
    font_size = 15
    color = $on_surface_variant
    position = 0, 8
    halign = center
    valign = center
}

# ──────────────────────────── password field ────────────────────────────────
input-field {
    monitor =
    size = 240, 40
    position = 0, -52
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 20
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    # Outline only: the box itself is fully transparent, so the blurred
    # wallpaper shows straight through and just the ring is drawn.
    outer_color = $primary
    inner_color = rgba(00000000)
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error
    capslock_color = $secondary

    placeholder_text = <span foreground="##d6c3b6"><i>Password…</i></span>
    fail_text = <span foreground="##ffb4ab">Wrong password ($ATTEMPTS)</span>
    hide_input = false
    # Hidden until you start typing: with nothing entered the whole field fades
    # out, and the first keystroke brings it back. fade_timeout is how long it
    # waits before disappearing again.
    fade_on_empty = true
    fade_timeout = 1500
}

# ────────────────────────────── context info ────────────────────────────────
# Uptime, just because
label {
    monitor =
    text = cmd[update:60000] echo "󰅶  $(uptime -p | sed 's/^up //')"
    font_family = JetBrainsMono Nerd Font
    font_size = 11
    color = $outline
    position = 0, 20
    halign = center
    valign = bottom
}
